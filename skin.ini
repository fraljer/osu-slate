[Colours]
// Combo Colours used in osu! standard. There can be up to 8 different combo colours.
// Additionally, Combo4 is the first Combo Colour displayed, followed by Combo1, then Combo2 and so on.
Combo1:					153,153,255
Combo2:					128,128,255
Combo3:					102,102,255
Combo4:					179,179,255

// Slider Colours
SliderBorder:				179,179,255
SliderTrackOverride:			20 ,20 ,26

// Colours used in the Song Select for the Song info.
SongSelectActiveText:			161,238,254
SongSelectInactiveText:			67 ,71 ,72

InputOverlayText:				255,255,255
StarBreakAdditive:			255,255,255

// Colour of the visualizer in the Main Menu (osu! supporter required to see).
MenuGlow:					179,179,255

